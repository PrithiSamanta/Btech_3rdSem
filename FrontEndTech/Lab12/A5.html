<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <ul>
      <li>Mango</li>
      <li>Apple</li>
      <li>Banana</li>
    </ul>
    <button>Click</button>
    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>
    <script>
      $("button").click(() => $("ul").append("<li>Hello World</li>"));
    </script>
  </body>
</html>
